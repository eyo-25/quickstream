name: 버그 신고
description: 퀵스트림이 기대와 다르게 동작합니다
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요?
      description: 기대한 동작과 실제 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: "1. ⌥Q 로 오버레이를 연다\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 퀵스트림 버전
      description: 메뉴바 아이콘 메뉴나 설정 창의 정보 탭에서 확인할 수 있습니다.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 버전과 칩
      placeholder: "macOS 15.1, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방법
      options: [Homebrew, 소스 설치(install.sh), 직접 내려받은 zip]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그·설정
      description: "`~/Library/Application Support/QuickStream/logs` 의 관련 부분이나 `update.log` 를 붙여 주세요. 개인 정보(URL, 클립보드 텍스트)는 지워 주세요."
      render: text
